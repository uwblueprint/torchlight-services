name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: torchlight_test
          POSTGRES_USER: torchlight
          POSTGRES_PASSWORD: torchlight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U torchlight -d torchlight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway credentials for the service container above; not secrets.
      DATABASE_URL: postgresql+asyncpg://torchlight:torchlight@localhost:5432/torchlight_test
      TEST_DATABASE_URL: postgresql+asyncpg://torchlight:torchlight@localhost:5432/torchlight_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - name: Migrations apply, reverse, and match the models
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Build and start the Compose stack
        run: docker compose up --build --detach --wait
      - name: Health check reaches the database
        run: curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8000/api/v1/health
      - name: Compose logs
        if: failure()
        run: docker compose logs
